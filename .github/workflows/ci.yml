name: CI/CD - MiBici MLOps

on:
  push:
    branches:
      - main
      - "integration/**"
      - "feat/**"
  pull_request:
    branches:
      - main
      - "integration/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas automatizadas (PyTest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12 con caché de pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar suite de pruebas con PyTest
        env:
          PYTHONPATH: .
        run: |
          mkdir -p reports
          python -m pytest -v --tb=short -m "not integration" --junitxml=reports/junit-pytest.xml

      - name: Publicar reporte de pruebas (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: reports/junit-pytest.xml
          retention-days: 14

  build-docker:
    name: Construcción de imagen Docker y smoke tests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker de la API (sin publicación en registry)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          load: true
          push: false
          tags: |
            mibici-api:${{ github.sha }}
            mibici-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar salud del contenedor de la API
        run: |
          docker run -d --name mibici-api-smoke -p 8000:8000 mibici-api:latest
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "API saludable en /health"
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondió correctamente en /health"
          docker logs mibici-api-smoke
          exit 1

      - name: Limpiar contenedor de smoke test
        if: always()
        run: docker rm -f mibici-api-smoke || true

      - name: Validar orquestación con Docker Compose (si existe docker-compose.yml)
        if: hashFiles('docker-compose.yml') != ''
        run: |
          docker compose config -q
          touch mlflow.db
          chmod 666 mlflow.db
          mkdir -p mlartifacts mlruns
          chmod 777 mlartifacts mlruns
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health && curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "Stack Docker Compose (MLflow + FastAPI) levantado y saludable"
              exit 0
            fi
            sleep 3
          done
          echo "Error al levantar el stack con Docker Compose"
          docker compose ps
          docker compose logs
          exit 1

      - name: Detener stack de Docker Compose
        if: always() && hashFiles('docker-compose.yml') != ''
        run: docker compose down -v || true
